button{height:44px;margin-top:8px;border:0;border-radius:8px;background:var(--indigo);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#4338CA}
.rodape{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--cinza)}
@media (max-width:900px){.visual{display:none}.painel{width:100%;padding:40px 24px}}
